<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThirstyAI calculator</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #5a5a5a;
    --border: #d0d0d0;
    --accent: #2b6cb0;
    --bar-track: #e6e6e6;
    --bar-min: #2b6cb0;
    --bar-mid: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #eaeaea;
      --bg: #14161a;
      --muted: #a0a0a0;
      --border: #3a3d42;
      --accent: #6ea8dc;
      --bar-track: #2a2d33;
      --bar-min: #6ea8dc;
      --bar-mid: #eaeaea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
  }
  .subtitle {
    margin: 0 0 24px;
    color: var(--muted);
  }
  form {
    display: grid;
    gap: 16px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .field-row > .field {
    flex: 1;
    min-width: 200px;
  }
  label {
    font-weight: 600;
    font-size: 0.9rem;
  }
  select, input[type="number"] {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    font-size: 1rem;
  }
  .radio-group {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .radio-group label {
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #derived-tokens {
    color: var(--muted);
    font-size: 0.85rem;
  }
  details {
    color: var(--muted);
    font-size: 0.9rem;
  }
  summary {
    cursor: pointer;
    font-weight: 600;
  }
  .region-note {
    color: var(--muted);
    font-size: 0.85rem;
  }
  #results {
    margin-top: 24px;
  }
  .result-row {
    margin-bottom: 16px;
  }
  .result-label {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .bar-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bar-track {
    position: relative;
    height: 12px;
    background: var(--bar-track);
    border-radius: 6px;
    overflow: visible;
  }
  .bar-min {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: var(--bar-min);
    border-radius: 6px;
  }
  .bar-mid-marker {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 2px;
    background: var(--bar-mid);
  }
  .bar-numbers {
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .note {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .confidence {
    font-weight: 600;
  }
  .unknown-model-hint {
    color: var(--accent);
    font-weight: 600;
  }
  .error {
    color: #c0392b;
    font-weight: 600;
  }
  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a {
    color: var(--accent);
  }
  @media (max-width: 600px) {
    .field-row {
      flex-direction: column;
    }
    .field-row > .field {
      min-width: 0;
    }
  }
</style>
</head>
<body>
<main>
  <h1>ThirstyAI calculator</h1>
  <p class="subtitle">water | energy | CO&#8322; footprint of AI calls &mdash; an estimate with ranges, not a measurement</p>

  <form>
    <div class="field">
      <label for="model">Model</label>
      <select id="model"></select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" value="1000" min="0" step="1">
        <div class="radio-group">
          <label><input type="radio" name="unit" id="unit-output-tokens" value="output-tokens" checked> output tokens</label>
          <label><input type="radio" name="unit" id="unit-words" value="words"> words</label>
        </div>
        <div id="derived-tokens" hidden></div>
      </div>

      <div class="field">
        <label for="region">Region</label>
        <select id="region"></select>
        <span class="region-note">reference year 2024</span>
      </div>
    </div>

    <details>
      <summary>Advanced</summary>
      <div class="field">
        <label for="tokens-in">Input tokens</label>
        <input type="number" id="tokens-in" value="0" min="0" step="1">
      </div>
    </details>
  </form>

  <section id="results" aria-live="polite"></section>

  <footer>
    Facts table generated <span id="facts-generated"></span> &middot; schema 0.3 &middot;
    <a href="https://github.com/Ascent04/ThirstyAI">source and methodology</a>
  </footer>
</main>
<script type="module" src="./bundle.js"></script>
</body>
</html>
